<!-- Injecté dans le <head> de toutes les pages Dataverse via :WebAnalyticsCode -->
<!-- Réf : https://guides.dataverse.org/en/latest/installation/config.html#web-analytics-code -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@v3.0.0/dist/cookieconsent.css" />

<!-- Matomo (chargé seulement si la catégorie "analytics" est acceptée, et uniquement en prod) -->
<script type="text/plain" data-category="analytics">
  //<![CDATA[
  if (window.location.hostname === 'data.sciencespo.fr') {
    var _paq = window._paq = window._paq || [];
    _paq.push(["disableCookies"]);
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function() {
      var u="//ws.sciences-po.fr/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '11']);
      var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
      g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
    })();
  }
  //]]>
</script>
<!-- End Matomo Code -->

<!-- Cookie Consent (type="module" => exécuté après le parsing du DOM, nécessaire car ce fichier est dans le <head>) -->

</script>
